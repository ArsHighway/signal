services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_local_only
      POSTGRES_DB: signalcare
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - signalcare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signalcare"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://signal:signal_local_only@db:5432/signalcare?sslmode=disable
      APP_ADDR: 0.0.0.0:8087
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-signal-user-demo}
      DEMO_DISPATCHER_PASSWORD: ${DEMO_DISPATCHER_PASSWORD:-signal-dispatcher-demo}
    ports:
      - "127.0.0.1:8087:8087"
    depends_on:
      db:
        condition: service_healthy
volumes:
  signalcare_data:
